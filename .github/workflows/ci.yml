name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Dépendances système (Graphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz graphviz-dev

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,visual]"

      - name: Style (ruff)
        run: |
          ruff check automata_extensions tests
          ruff format --check automata_extensions tests

      - name: Types (mypy)
        run: mypy

      - name: Tests et couverture
        run: pytest --cov=automata_extensions --cov-report=term-missing -q
